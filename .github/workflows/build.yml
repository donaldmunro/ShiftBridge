name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests
        run: dotnet test ShiftBridge.sln -c Release
      - name: Publish exe unique
        run: >
          dotnet publish src/ShiftBridge.App/ShiftBridge.App.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ShiftBridge-win-x64
          path: publish/ShiftBridge.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ShiftBridge.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Workload Android
        run: dotnet workload install maui-android
      # Les tests ne dépendent d'aucune API Windows : ils tournent aussi sous Linux.
      - name: Tests
        run: dotnet test tests/ShiftBridge.Core.Tests -c Release
      - name: Clé de signature (si fournie)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shiftbridge.keystore"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi
      - name: Publier l'APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          SIGN_ARGS=()
          if [ "$SIGNED" = "true" ]; then
            SIGN_ARGS=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/shiftbridge.keystore"
                       "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
                       -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
                       -p:AndroidSigningStorePass=env:ANDROID_STORE_PASSWORD)
          fi
          dotnet publish src/ShiftBridge.Android/ShiftBridge.Android.csproj -f net10.0-android -c Release "${SIGN_ARGS[@]}" -o apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShiftBridge-android
          path: apk/*-Signed.apk
      # Un APK signé avec la clé de debug ne se publie pas : seulement avec une vraie clé.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*-Signed.apk
